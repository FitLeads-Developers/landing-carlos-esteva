<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Carlos Esteva</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;padding:0;font-family:'Barlow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(155deg,#0b1e4b,#123a8f)}
a{text-decoration:none}
::selection{background:#1758c8;color:#fff}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.code{font-family:'Archivo Black',sans-serif;font-style:italic;font-size:clamp(90px,18vw,180px);line-height:1;margin:0;text-shadow:0 6px 0 rgba(7,18,51,.45)}
h1{font-family:'Archivo Black',sans-serif;font-style:italic;text-transform:uppercase;font-size:clamp(22px,3.6vw,34px);line-height:1.15;margin:18px 0 14px}
p{font-size:17px;line-height:1.55;color:#bcd2ff;max-width:460px;margin:0 auto 32px}
.cta-btn{display:inline-block;background:#fff;color:#0b1e4b;font-family:'Archivo Black',sans-serif;font-style:italic;text-transform:uppercase;font-size:clamp(15px,1.6vw,18px);padding:16px 32px;border-radius:12px;box-shadow:0 8px 24px rgba(7,18,51,.4);transition:transform .15s ease,box-shadow .15s ease}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(23,88,200,.45)}
footer{text-align:center;padding:20px 24px;font-size:13px;color:#8ea3cf}
footer a{color:#8ea3cf;text-decoration:underline}
</style>
</head>
<body>
<main>
  <div>
    <p class="code">404</p>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página haya cambiado de sitio. Tu mejor versión sigue estando a un click.</p>
    <a class="cta-btn" href="/">← Volver al inicio</a>
  </div>
</main>
<footer>
  Desarrollado por <a href="https://fit-leads.com">fit-leads.com</a>
</footer>
</body>
</html>
